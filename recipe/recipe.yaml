schema_version: 1

context:
  name: asana
  version: "5.2.5"

package:
  name: python-asana
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/asana-${{ version }}.tar.gz
  sha256: 5b4610830d5480f12508e6cf154fa2c79adc6d10613daf45c09d3e869f7cf61f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - certifi >=2017.4.17
    - python-dateutil >=2.1
    - six >=1.10
    - urllib3 >=1.23

tests:
  - python:
      imports:
        - asana
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Official Python client library for the Asana API v1
  license: MIT
  license_file: LICENSE
  homepage: http://github.com/asana/python-asana
  repository: http://github.com/asana/python-asana
  documentation: http://github.com/asana/python-asana

extra:
  recipe-maintainers:
    - xylar
