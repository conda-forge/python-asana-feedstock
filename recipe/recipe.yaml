schema_version: 1

context:
  name: asana
  version: "5.4.0"

package:
  name: python-asana
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/asana-${{ version }}.tar.gz
  sha256: df29d426542196abf014b9f7163237af748015d16c7597965477dea40d77f8cc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - certifi >=2017.4.17
    - python-dateutil >=2.1
    - six >=1.10
    - urllib3 >=1.23

tests:
  - python:
      imports:
        - asana
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Official Python client library for the Asana API v1
  license: MIT
  license_file: LICENSE
  homepage: http://github.com/asana/python-asana
  repository: http://github.com/asana/python-asana
  documentation: http://github.com/asana/python-asana

extra:
  recipe-maintainers:
    - xylar
